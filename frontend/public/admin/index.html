<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Helix24 Content Editor</title>
  <link rel="icon" href="/icon.png" />
  <!-- Absolute path: the editor is also served at /admin (no trailing slash), where a relative config.yml would resolve to /config.yml -->
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  <style>
    .hx-ip { font-family: system-ui, -apple-system, sans-serif; }
    .hx-ip-selected { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; min-height: 44px; }
    .hx-ip-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid #c4b5fd; border-radius: 999px; background: #f5f3ff; font-size: 13px; }
    .hx-ip-chip img { width: 22px; height: 22px; object-fit: contain; }
    .hx-ip-chip button { border: 0; background: none; cursor: pointer; font-size: 15px; line-height: 1; color: #6d28d9; }
    .hx-ip-search { width: 100%; padding: 8px 10px; border: 1px solid #dfdfe3; border-radius: 6px; font-size: 14px; margin-bottom: 10px; }
    .hx-ip-group { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #64748b; margin: 8px 0 6px; }
    .hx-ip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; max-height: 280px; overflow-y: auto; padding: 2px; }
    .hx-ip-opt { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border: 1px solid #e2e8f0; border-radius: 8px; background: #fff; cursor: pointer; font-size: 11px; color: #334155; text-align: center; line-height: 1.2; }
    .hx-ip-opt img { width: 30px; height: 30px; object-fit: contain; }
    .hx-ip-opt:hover { border-color: #a78bfa; }
    .hx-ip-opt[aria-pressed="true"] { border-color: #6d28d9; background: #f5f3ff; box-shadow: 0 0 0 2px #ddd6fe; }
    .hx-ip-empty { color: #94a3b8; font-size: 13px; }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"></script>
  <script>
    // "iconpicker" widget: pick icons by sight from /admin/icons.json (brand logos and 3D icons; generated by scripts/cms-config.mjs).
    // Stores an array of icon keys (at most `max`), or a single key when the field sets `single: true`.
    (function () {
      var toArray = function (v) {
        if (!v) return [];
        if (typeof v === 'string') return [v];
        return v.toJS ? v.toJS() : v;
      };

      var iconList = null, iconListPromise = null;
      var loadIcons = function () {
        iconListPromise = iconListPromise || fetch('/admin/icons.json').then(function (r) { return r.json(); }).then(function (list) { iconList = list; return list; });
        return iconListPromise;
      };

      var IconPicker = createClass({
        getInitialState: function () { return { q: '', ready: !!iconList }; },
        componentDidMount: function () { var self = this; if (!iconList) loadIcons().then(function () { self.setState({ ready: true }); }); },
        options: function () { return iconList || []; },
        commit: function (keys) {
          var single = this.props.field.get('single');
          this.props.onChange(single ? keys[0] || '' : keys);
        },
        toggle: function (key) {
          var max = this.props.field.get('single') ? 1 : this.props.field.get('max') || 2;
          var cur = toArray(this.props.value);
          var next = cur.indexOf(key) >= 0 ? cur.filter(function (k) { return k !== key; }) : cur.concat([key]).slice(-max);
          this.commit(next);
        },
        render: function () {
          var self = this, opts = this.options(), cur = toArray(this.props.value), q = this.state.q.toLowerCase();
          var byKey = {}; opts.forEach(function (o) { byKey[o.value] = o; });
          var match = function (o) { return !q || o.label.toLowerCase().indexOf(q) >= 0; };
          var group = function (title, prefix) {
            var items = opts.filter(function (o) { return o.value.indexOf(prefix) === 0 && match(o); });
            if (!items.length) return null;
            return h('div', { key: prefix },
              h('div', { className: 'hx-ip-group' }, title),
              h('div', { className: 'hx-ip-grid' }, items.map(function (o) {
                return h('button', { key: o.value, type: 'button', className: 'hx-ip-opt', title: o.label, 'aria-pressed': cur.indexOf(o.value) >= 0 ? 'true' : 'false', onClick: function () { self.toggle(o.value); } },
                  h('img', { src: o.src, alt: '' }),
                  h('span', null, o.label.replace(/^(Logo|3D): /, '')));
              })));
          };
          return h('div', { className: 'hx-ip ' + (this.props.classNameWrapper || ''), id: this.props.forID },
            h('div', { className: 'hx-ip-selected' },
              cur.length ? cur.map(function (k) {
                var o = byKey[k] || { label: k, src: '' };
                return h('span', { key: k, className: 'hx-ip-chip' },
                  h('img', { src: o.src, alt: '' }), o.label,
                  h('button', { type: 'button', title: 'Remove', onClick: function () { self.toggle(k); } }, '×'));
              }) : h('span', { className: 'hx-ip-empty' }, 'No icon selected')),
            h('input', { className: 'hx-ip-search', type: 'search', placeholder: 'Search icons (e.g. google, phone, shop)', value: this.state.q, onChange: function (e) { self.setState({ q: e.target.value }); } }),
            group('Brand logos', 'logo-'),
            group('3D icons', '3d-'));
        },
      });

      CMS.registerWidget('iconpicker', IconPicker);
    })();
  </script>
</body>
</html>
