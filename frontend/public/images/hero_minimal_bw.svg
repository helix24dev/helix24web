<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Dark Obsidian Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080c"/>
      <stop offset="50%" stop-color="#12121a"/>
      <stop offset="100%" stop-color="#030305"/>
    </linearGradient>

    <!-- Metallic Monochrome Gradients -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#888899" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1a1a24" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#777788" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowCore" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#9999bb" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="blurLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Subtle Ambient Glow -->
  <circle cx="400" cy="250" r="280" fill="url(#glowCore)"/>

  <!-- Geometric Grid Rays (Hyperrealistic Minimal Lines) -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="0.75">
    <line x1="100" y1="0" x2="700" y2="600"/>
    <line x1="700" y1="0" x2="100" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <circle cx="400" cy="300" r="150" fill="none" stroke-dasharray="2,4"/>
    <circle cx="400" cy="300" r="250" fill="none" stroke-dasharray="1,6"/>
  </g>

  <!-- Architectural 3D Isometric Slabs (Monochrome Glass & Obsidian) -->
  <g transform="translate(400, 290) rotate(-15) scale(0.95)" filter="url(#subtleGlow)">
    
    <!-- Slab 3 (Background Deep Shadow Layer) -->
    <g transform="translate(0, 70)">
      <polygon points="-240,-60 0,-180 240,-60 0,60" fill="#0d0d14" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
      <polygon points="0,60 240,-60 240,-40 0,80" fill="#06060a"/>
      <polygon points="-240,-60 0,60 0,80 -240,-40" fill="#12121c"/>
    </g>

    <!-- Slab 2 (Mid-layer Glass Slab) -->
    <g transform="translate(0, 10)">
      <polygon points="-260,-60 0,-180 260,-60 0,60" fill="url(#silverGrad)" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.2"/>
      <polygon points="0,60 260,-60 260,-48 0,72" fill="#1a1a26" fill-opacity="0.4"/>
      <polygon points="-260,-60 0,60 0,72 -260,-48" fill="#2a2a3a" fill-opacity="0.3"/>
      
      <!-- Architectural Grid Lines on Slab 2 -->
      <line x1="-130" y1="0" x2="130" y2="-120" stroke="#ffffff" stroke-opacity="0.25" stroke-width="0.8"/>
      <line x1="-65" y1="30" x2="195" y2="-90" stroke="#ffffff" stroke-opacity="0.2" stroke-width="0.8"/>
      <line x1="-195" y1="-30" x2="65" y2="-150" stroke="#ffffff" stroke-opacity="0.2" stroke-width="0.8"/>
    </g>

    <!-- Slab 1 (Top Obsidian Glass Slab with Stark Light Edges) -->
    <g transform="translate(0, -50)">
      <!-- Top Face -->
      <polygon points="-280,-60 0,-180 280,-60 0,60" fill="url(#silverGrad)" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.5"/>
      <!-- Right Edge -->
      <polygon points="0,60 280,-60 280,-45 0,75" fill="#3a3a4c" fill-opacity="0.5"/>
      <!-- Left Edge -->
      <polygon points="-280,-60 0,60 0,75 -280,-45" fill="#181822" fill-opacity="0.8"/>

      <!-- Glowing Nodes & Wireframe Laser Beams -->
      <circle cx="0" cy="-60" r="4" fill="#ffffff" filter="url(#subtleGlow)"/>
      <circle cx="-140" cy="0" r="3" fill="#cccccc"/>
      <circle cx="140" cy="0" r="3" fill="#cccccc"/>
      <circle cx="0" cy="60" r="3.5" fill="#ffffff"/>

      <line x1="-140" y1="0" x2="0" y2="-60" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.2"/>
      <line x1="0" y1="-60" x2="140" y2="0" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.2"/>
      <line x1="140" y1="0" x2="0" y2="60" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.2"/>
      <line x1="0" y1="60" x2="-140" y2="0" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.2"/>
    </g>
  </g>

  <!-- Vertical Light Beams -->
  <line x1="400" y1="40" x2="400" y2="240" stroke="url(#wireGrad)" stroke-width="1.5"/>
  <line x1="260" y1="120" x2="260" y2="300" stroke="url(#wireGrad)" stroke-width="1" opacity="0.6"/>
  <line x1="540" y1="120" x2="540" y2="300" stroke="url(#wireGrad)" stroke-width="1" opacity="0.6"/>

  <!-- Minimalist Typography / Details -->
  <text x="40" y="560" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#ffffff" letter-spacing="3" opacity="0.4">HELIX24 // ARCHITECTURAL SOFTWARE ENGINE</text>
  <text x="760" y="560" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#ffffff" letter-spacing="3" text-anchor="end" opacity="0.4">01 / HYPERREALISTIC MONOCHROME</text>
</svg>
