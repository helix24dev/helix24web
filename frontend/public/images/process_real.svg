<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="100%" fill="none">
  <rect width="900" height="180" rx="14" fill="#0A0616"/>
  <rect width="898" height="178" x="1" y="1" rx="13" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.5"/>

  <!-- Step 1: DISCOVERY & MARKET AUDIT -->
  <g transform="translate(60, 30)">
    <circle cx="65" cy="50" r="38" fill="#1A0D38" stroke="#8B5CF6" stroke-width="2.5"/>
    <text x="65" y="57" fill="#8B5CF6" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" text-anchor="middle">01</text>
    <text x="65" y="112" fill="#FFF" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Discovery &amp; Market Audit</text>
    <text x="65" y="130" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">SEO &amp; Business Strategy</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 230 80 L 310 80" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="310,75 320,80 310,85" fill="#8B5CF6"/>

  <!-- Step 2: DEVELOPMENT & UI/UX DESIGN -->
  <g transform="translate(345, 30)">
    <circle cx="65" cy="50" r="38" fill="#0D281E" stroke="#10B981" stroke-width="2.5"/>
    <text x="65" y="57" fill="#10B981" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" text-anchor="middle">02</text>
    <text x="65" y="112" fill="#FFF" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Development &amp; UI/UX Design</text>
    <text x="65" y="130" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Web, Apps &amp; Branding</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 515 80 L 595 80" stroke="#10B981" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="595,75 605,80 595,85" fill="#10B981"/>

  <!-- Step 3: GROWTH MARKETING & SCALING -->
  <g transform="translate(630, 30)">
    <circle cx="65" cy="50" r="38" fill="#2E1D06" stroke="#F59E0B" stroke-width="2.5"/>
    <text x="65" y="57" fill="#F59E0B" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" text-anchor="middle">03</text>
    <text x="65" y="112" fill="#FFF" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Growth Marketing &amp; Scaling</text>
    <text x="65" y="130" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Google Ads &amp; Local Pack</text>
  </g>
</svg>
