<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <!-- Outer Frame -->
  <rect width="600" height="400" rx="16" fill="#0C071E"/>
  <rect width="598" height="398" x="1" y="1" rx="15" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1.5"/>

  <!-- Browser Header Bar -->
  <rect width="600" height="44" rx="16" fill="#140B2A"/>
  <circle cx="20" cy="22" r="5" fill="#EF4444"/>
  <circle cx="36" cy="22" r="5" fill="#F59E0B"/>
  <circle cx="52" cy="22" r="5" fill="#10B981"/>

  <!-- URL Bar -->
  <rect x="76" y="10" width="340" height="24" rx="12" fill="#1F123A" stroke="rgba(255,255,255,0.1)"/>
  <text x="92" y="26" fill="#A78BFA" font-family="'Inter', sans-serif" font-size="11">🔒 https://helix24.in/enterprise-app</text>

  <!-- Performance Pill -->
  <rect x="428" y="10" width="156" height="24" rx="12" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981"/>
  <text x="506" y="26" fill="#10B981" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">⚡ 0.28s SPEED • 100/100</text>

  <!-- Web Application UI Content -->
  <g transform="translate(20, 58)">
    <!-- Header Banner in App -->
    <rect width="560" height="70" rx="12" fill="linear-gradient(135deg, #1E123B 0%, #140A28 100%)" stroke="rgba(139, 92, 246, 0.2)"/>
    <text x="24" y="32" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Enterprise Cloud Platform</text>
    <text x="24" y="50" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="11">Sub-second web performance, real-time analytics &amp; SOC 2 security compliance.</text>
    
    <rect x="420" y="20" width="120" height="32" rx="8" fill="#8B5CF6"/>
    <text x="480" y="41" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Launch Portal →</text>

    <!-- 3 Modern Metric Cards -->
    <g transform="translate(0, 84)">
      <rect width="176" height="85" rx="10" fill="#160C33" stroke="rgba(255,255,255,0.06)"/>
      <text x="16" y="28" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="10" font-weight="600">ACTIVE USERS</text>
      <text x="16" y="56" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">42,850</text>
      <text x="16" y="72" fill="#10B981" font-family="'Inter', sans-serif" font-size="10">↑ +24% this month</text>

      <rect x="192" width="176" height="85" rx="10" fill="#160C33" stroke="rgba(255,255,255,0.06)"/>
      <text x="208" y="28" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="10" font-weight="600">PAGE SPEED SLA</text>
      <text x="208" y="56" fill="#10B981" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">0.28 sec</text>
      <text x="208" y="72" fill="#A78BFA" font-family="'Inter', sans-serif" font-size="10">Core Web Vitals #1</text>

      <rect x="384" width="176" height="85" rx="10" fill="#160C33" stroke="rgba(255,255,255,0.06)"/>
      <text x="400" y="28" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="10" font-weight="600">UPTIME GUARANTEE</text>
      <text x="400" y="56" fill="#60A5FA" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">99.99%</text>
      <text x="400" y="72" fill="#3B82F6" font-family="'Inter', sans-serif" font-size="10">SOC 2 Compliant</text>
    </g>

    <!-- Main SaaS Interface Mockup Card -->
    <g transform="translate(0, 182)">
      <rect width="560" height="142" rx="12" fill="#140A2A" stroke="rgba(139, 92, 246, 0.25)"/>
      <text x="20" y="28" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Interactive Application Architecture</text>

      <!-- Visual UI Mockup Bars -->
      <rect x="20" y="44" width="220" height="12" rx="6" fill="#8B5CF6" fill-opacity="0.8"/>
      <rect x="20" y="66" width="340" height="8" rx="4" fill="rgba(255,255,255,0.15)"/>
      <rect x="20" y="82" width="280" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
      <rect x="20" y="98" width="190" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>

      <!-- Graphic Visual Chart Card on Right -->
      <rect x="380" y="20" width="160" height="102" rx="8" fill="#1C103B" stroke="rgba(16, 185, 129, 0.3)"/>
      <text x="392" y="38" fill="#10B981" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700">LIVE DATA STREAM</text>
      <path d="M 392 95 Q 430 80, 460 65 T 528 45" stroke="#10B981" stroke-width="2.5" fill="none"/>
      <circle cx="528" cy="45" r="4" fill="#10B981"/>
    </g>
  </g>
</svg>
