<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="seoBgTheme" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0614"/>
      <stop offset="100%" stop-color="#140a28"/>
    </linearGradient>
    <linearGradient id="purpleChartLine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="purpleChartArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#seoBgTheme)"/>

  <!-- Minimalist Grid System -->
  <g stroke="#8b5cf6" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="3 3">
    <line x1="80" y1="60" x2="520" y2="60"/>
    <line x1="80" y1="130" x2="520" y2="130"/>
    <line x1="80" y1="200" x2="520" y2="200"/>
    <line x1="80" y1="270" x2="520" y2="270"/>
    <line x1="80" y1="340" x2="520" y2="340"/>
  </g>

  <!-- Growth Area Curve (Purple Theme) -->
  <path d="M 80,310 Q 180,290 260,210 T 420,130 T 520,70 L 520,340 L 80,340 Z" fill="url(#purpleChartArea)"/>
  
  <!-- Main High-Contrast Trend Line -->
  <path d="M 80,310 Q 180,290 260,210 T 420,130 T 520,70" fill="none" stroke="url(#purpleChartLine)" stroke-width="4" stroke-linecap="round"/>

  <!-- Data Point Beacons -->
  <g fill="#ffffff">
    <circle cx="80" cy="310" r="4" stroke="#6d28d9" stroke-width="2"/>
    <circle cx="190" cy="275" r="4" stroke="#6d28d9" stroke-width="2"/>
    <circle cx="280" cy="195" r="5" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="390" cy="145" r="5" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="520" cy="70" r="7" fill="#ffffff" stroke="#c4b5fd" stroke-width="2.5"/>
  </g>

  <!-- Glowing Target Pulse around Peak Data Point -->
  <circle cx="520" cy="70" r="16" fill="none" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="1.8" stroke-dasharray="3 3"/>
  <circle cx="520" cy="70" r="28" fill="none" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Floating Metric Metric Boxes -->
  <g transform="translate(360, 170)">
    <rect width="135" height="58" rx="10" fill="#1c0f38" fill-opacity="0.9" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="16" y="24" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#a78bfa" letter-spacing="1">ORGANIC TRAFFIC</text>
    <text x="16" y="46" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" fill="#ffffff">+340% ROAS</text>
  </g>

  <g transform="translate(130, 110)">
    <rect width="115" height="50" rx="10" fill="#1c0f38" fill-opacity="0.85" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1"/>
    <text x="14" y="22" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#ddd6fe" letter-spacing="1">CONVERSION</text>
    <text x="14" y="40" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="14" fill="#ffffff">4.82x GAIN</text>
  </g>

  <text x="80" y="375" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a78bfa" opacity="0.6">GROWTH_OPTIMIZATION // DATA_MATH</text>
</svg>
