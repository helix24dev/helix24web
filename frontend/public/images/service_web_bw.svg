<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="webBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#020204"/>
    </linearGradient>
    <linearGradient id="codeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#aaaaaa" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="600" height="400" fill="url(#webBg)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
  </g>

  <!-- Glassmorphism Code Terminal Frame -->
  <rect x="60" y="50" width="480" height="300" rx="12" fill="#0f0f17" fill-opacity="0.8" stroke="url(#glassBorder)" stroke-width="1.5"/>

  <!-- Window Controls (Monochrome) -->
  <circle cx="95" cy="80" r="5" fill="#ffffff" fill-opacity="0.8"/>
  <circle cx="115" cy="80" r="5" fill="#ffffff" fill-opacity="0.4"/>
  <circle cx="135" cy="80" r="5" fill="#ffffff" fill-opacity="0.2"/>
  <line x1="60" y1="102" x2="540" y2="102" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Code Structure / System Architecture (Hyperrealistic Minimal Lines) -->
  <g fill="none" stroke-linecap="round">
    <!-- Code Blocks -->
    <rect x="95" y="130" width="120" height="8" rx="4" fill="url(#codeGlow)"/>
    <rect x="95" y="150" width="220" height="6" rx="3" fill="#ffffff" fill-opacity="0.3"/>
    <rect x="120" y="166" width="180" height="6" rx="3" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="120" y="182" width="240" height="6" rx="3" fill="url(#codeGlow)"/>
    <rect x="145" y="198" width="130" height="6" rx="3" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="95" y="224" width="90" height="8" rx="4" fill="#ffffff" fill-opacity="0.7"/>
    <rect x="95" y="244" width="260" height="6" rx="3" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="120" y="260" width="190" height="6" rx="3" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="95" y="286" width="140" height="8" rx="4" fill="url(#codeGlow)"/>
  </g>

  <!-- Floating Glass Component Card (3D Inset Overlay) -->
  <g transform="translate(340, 140)">
    <rect width="170" height="170" rx="10" fill="#181824" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
    <!-- Wireframe Graph / Layout inside Floating Card -->
    <rect x="20" y="20" width="130" height="40" rx="6" fill="#252535" stroke="#ffffff" stroke-opacity="0.2"/>
    <line x1="30" y1="40" x2="80" y2="40" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9"/>
    
    <rect x="20" y="72" width="60" height="75" rx="6" fill="#1d1d2b" stroke="#ffffff" stroke-opacity="0.15"/>
    <rect x="90" y="72" width="60" height="75" rx="6" fill="#1d1d2b" stroke="#ffffff" stroke-opacity="0.15"/>
    
    <circle cx="50" cy="110" r="14" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
    <line x1="105" y1="95" x2="135" y2="95" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/>
    <line x1="105" y1="110" x2="125" y2="110" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.3"/>
    <line x1="105" y1="125" x2="130" y2="125" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.4"/>
  </g>

  <text x="520" y="375" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ffffff" opacity="0.3" text-anchor="end">&lt;WEB_ENGINEERING/&gt;</text>
</svg>
