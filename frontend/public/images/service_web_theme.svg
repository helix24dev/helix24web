<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="webBgTheme" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0717"/>
      <stop offset="100%" stop-color="#05030a"/>
    </linearGradient>
    <linearGradient id="codeGlowTheme" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="purpleGlassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#webBgTheme)"/>
  
  <!-- Subtle Purple Grid Lines -->
  <g stroke="#8b5cf6" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
  </g>

  <!-- Glassmorphism Code Terminal Frame -->
  <rect x="50" y="40" width="500" height="320" rx="14" fill="#150c2a" fill-opacity="0.85" stroke="url(#purpleGlassBorder)" stroke-width="1.5"/>

  <!-- Window Controls (Violet Brand Tones) -->
  <circle cx="85" cy="70" r="5" fill="#a78bfa"/>
  <circle cx="105" cy="70" r="5" fill="#8b5cf6"/>
  <circle cx="125" cy="70" r="5" fill="#6d28d9"/>
  <line x1="50" y1="92" x2="550" y2="92" stroke="#8b5cf6" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Code Structure / System Architecture (Vibrant Violet Highlights) -->
  <g fill="none" stroke-linecap="round">
    <rect x="85" y="120" width="130" height="8" rx="4" fill="url(#codeGlowTheme)"/>
    <rect x="85" y="140" width="220" height="6" rx="3" fill="#a78bfa" fill-opacity="0.4"/>
    <rect x="110" y="156" width="180" height="6" rx="3" fill="#8b5cf6" fill-opacity="0.3"/>
    <rect x="110" y="172" width="240" height="6" rx="3" fill="url(#codeGlowTheme)"/>
    <rect x="135" y="188" width="130" height="6" rx="3" fill="#ddd6fe" fill-opacity="0.35"/>
    <rect x="85" y="214" width="100" height="8" rx="4" fill="#a78bfa" fill-opacity="0.8"/>
    <rect x="85" y="234" width="260" height="6" rx="3" fill="#8b5cf6" fill-opacity="0.4"/>
    <rect x="110" y="250" width="190" height="6" rx="3" fill="#6d28d9" fill-opacity="0.3"/>
    <rect x="85" y="276" width="150" height="8" rx="4" fill="url(#codeGlowTheme)"/>
  </g>

  <!-- Floating Glass Component Card (3D Purple Overlay) -->
  <g transform="translate(340, 130)">
    <rect width="180" height="180" rx="12" fill="#1f113d" fill-opacity="0.9" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="1.2"/>
    <!-- Wireframe Graph / Layout inside Floating Card -->
    <rect x="20" y="20" width="140" height="42" rx="6" fill="#2e1957" stroke="#8b5cf6" stroke-opacity="0.3"/>
    <line x1="30" y1="41" x2="90" y2="41" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
    
    <rect x="20" y="76" width="65" height="80" rx="6" fill="#241344" stroke="#8b5cf6" stroke-opacity="0.2"/>
    <rect x="95" y="76" width="65" height="80" rx="6" fill="#241344" stroke="#8b5cf6" stroke-opacity="0.2"/>
    
    <circle cx="52" cy="116" r="15" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <line x1="110" y1="98" x2="145" y2="98" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
    <line x1="110" y1="114" x2="135" y2="114" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>
    <line x1="110" y1="130" x2="140" y2="130" stroke="#6d28d9" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text x="530" y="378" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a78bfa" opacity="0.6" text-anchor="end">&lt;WEB_ENGINEERING/&gt;</text>
</svg>
