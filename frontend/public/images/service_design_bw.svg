<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="dsgnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080d"/>
      <stop offset="100%" stop-color="#020204"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#dsgnBg)"/>

  <!-- Golden Ratio Grid / Design Studio Geometry (Monochrome) -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" fill="none">
    <rect x="100" y="50" width="400" height="300" stroke="#ffffff" stroke-opacity="0.2"/>
    <circle cx="300" cy="200" r="150"/>
    <circle cx="300" cy="200" r="92.7"/>
    <circle cx="300" cy="200" r="57.3"/>
    <line x1="100" y1="200" x2="500" y2="200"/>
    <line x1="300" y1="50" x2="300" y2="350"/>
    <line x1="100" y1="50" x2="500" y2="350"/>
    <line x1="500" y1="50" x2="100" y2="350"/>
  </g>

  <!-- Central Typography / Brand Mark Sculpture -->
  <g transform="translate(300, 200)" stroke="#ffffff" stroke-linecap="round">
    <path d="M-40,-50 C0,-90 40,-90 40,-50 C40,-10 -40,-10 -40,30 C-40,70 0,70 40,30" fill="none" stroke-width="4" stroke-opacity="0.9"/>
    <circle cx="-40" cy="-50" r="5" fill="#ffffff"/>
    <circle cx="40" cy="30" r="5" fill="#ffffff"/>
    <circle cx="0" cy="-10" r="6" fill="#ffffff" fill-opacity="0.3"/>
  </g>

  <!-- Vector Handles & Bezier Nodes -->
  <g fill="#ffffff" stroke="#000000" stroke-width="1">
    <rect x="256" y="146" width="8" height="8"/>
    <rect x="336" y="226" width="8" height="8"/>
    <line x1="260" y1="150" x2="210" y2="130" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="210" cy="130" r="4" fill="#ffffff"/>
  </g>

  <text x="500" y="375" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#ffffff" opacity="0.3" text-anchor="end">BRANDING // UI/UX DESIGN SYSTEM</text>
</svg>
