<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <!-- Outer Window Background -->
  <rect width="600" height="400" rx="14" fill="#0C081A"/>
  <rect width="598" height="398" x="1" y="1" rx="13" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.5"/>

  <!-- Store Header Bar -->
  <rect width="600" height="40" fill="rgba(255,255,255,0.04)"/>
  <text x="24" y="25" fill="#A78BFA" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">BLOOM &amp; CO. STOREFRONT</text>
  <text x="490" y="25" fill="#10B981" font-family="'Inter', sans-serif" font-size="11" font-weight="600">🛒 Cart (2 Items)</text>

  <!-- Product Image Showcase Box -->
  <rect x="24" y="56" width="240" height="320" rx="12" fill="#170F2C" stroke="rgba(139, 92, 246, 0.3)"/>
  <rect x="44" y="76" width="200" height="170" rx="10" fill="#241645"/>
  <text x="144" y="155" fill="#A78BFA" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" text-anchor="middle">LUXURY PRODUCT</text>
  <text x="144" y="175" fill="#FFF" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" text-anchor="middle">$149.00</text>

  <!-- 1-Click Checkout Button -->
  <rect x="44" y="260" width="200" height="40" rx="8" fill="#10B981"/>
  <text x="144" y="284" fill="#FFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Buy Now — 1-Click Checkout</text>

  <rect x="44" y="310" width="200" height="36" rx="8" fill="#000" stroke="rgba(255,255,255,0.2)"/>
  <text x="144" y="333" fill="#FFF" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Pay with Pay / Shop Pay</text>

  <!-- Store Analytics & Conversion Funnel Right Pane -->
  <rect x="284" y="56" width="292" height="150" rx="12" fill="#160E2A" stroke="rgba(255,255,255,0.08)"/>
  <text x="300" y="80" fill="#FFF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">E-Commerce Conversion Rate</text>
  <text x="300" y="112" fill="#10B981" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">4.2% CR</text>
  <text x="300" y="132" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="10">+34% Increase in Cart Conversions</text>
  <text x="300" y="152" fill="#8B5CF6" font-family="'Inter', sans-serif" font-size="10">Shopify Plus &amp; WooCommerce Custom Liquid</text>

  <!-- Sales Revenue Badge -->
  <rect x="284" y="220" width="292" height="156" rx="12" fill="#1A1032" stroke="rgba(139, 92, 246, 0.3)"/>
  <text x="300" y="248" fill="#FFF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">Total Monthly Store Revenue</text>
  <text x="300" y="284" fill="#F59E0B" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">$312,450</text>
  <text x="300" y="306" fill="#10B981" font-family="'Inter', sans-serif" font-size="11">↑ 4.2x ROAS on Google Shopping &amp; Meta</text>
</svg>
