<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="dsgnBgTheme" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0616"/>
      <stop offset="100%" stop-color="#030206"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#dsgnBgTheme)"/>

  <!-- Golden Ratio Grid / Design Studio Geometry (Purple Theme) -->
  <g stroke="#8b5cf6" stroke-opacity="0.2" stroke-width="1" fill="none">
    <rect x="100" y="50" width="400" height="300" stroke="#a78bfa" stroke-opacity="0.3"/>
    <circle cx="300" cy="200" r="150"/>
    <circle cx="300" cy="200" r="92.7"/>
    <circle cx="300" cy="200" r="57.3"/>
    <line x1="100" y1="200" x2="500" y2="200"/>
    <line x1="300" y1="50" x2="300" y2="350"/>
    <line x1="100" y1="50" x2="500" y2="350"/>
    <line x1="500" y1="50" x2="100" y2="350"/>
  </g>

  <!-- Central Typography / Brand Mark Sculpture -->
  <g transform="translate(300, 200)" stroke="#c4b5fd" stroke-linecap="round">
    <path d="M-40,-50 C0,-90 40,-90 40,-50 C40,-10 -40,-10 -40,30 C-40,70 0,70 40,30" fill="none" stroke-width="4.5" stroke-opacity="0.95"/>
    <circle cx="-40" cy="-50" r="5" fill="#ffffff"/>
    <circle cx="40" cy="30" r="5" fill="#ffffff"/>
    <circle cx="0" cy="-10" r="6" fill="#8b5cf6" fill-opacity="0.6"/>
  </g>

  <!-- Vector Handles & Bezier Nodes -->
  <g fill="#ffffff" stroke="#6d28d9" stroke-width="1.5">
    <rect x="256" y="146" width="8" height="8"/>
    <rect x="336" y="226" width="8" height="8"/>
    <line x1="260" y1="150" x2="210" y2="130" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="1.2"/>
    <circle cx="210" cy="130" r="4.5" fill="#c4b5fd"/>
  </g>

  <text x="500" y="375" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#a78bfa" opacity="0.6" text-anchor="end">BRANDING // UI/UX DESIGN SYSTEM</text>
</svg>
