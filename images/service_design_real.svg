<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <!-- Outer Frame -->
  <rect width="600" height="400" rx="16" fill="#0A0618"/>
  <rect width="598" height="398" x="1" y="1" rx="15" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1.5"/>

  <!-- Figma Interface Header -->
  <rect width="600" height="44" rx="16" fill="#140B2A"/>
  <text x="24" y="27" fill="#F24E1E" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">❖ Figma Canvas</text>
  <text x="130" y="27" fill="#FFF" font-family="'Inter', sans-serif" font-size="11" font-weight="500">// Brand Identity &amp; UI System</text>

  <!-- Left: Figma Layer Tree & Design Tokens -->
  <g transform="translate(20, 58)">
    <rect width="160" height="322" rx="10" fill="#140A28" stroke="rgba(255,255,255,0.06)"/>
    <text x="16" y="24" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="9" font-weight="700">DESIGN SYSTEM TOKENS</text>

    <!-- Layers -->
    <g transform="translate(12, 36)">
      <rect width="136" height="26" rx="6" fill="#1E103B"/>
      <text x="12" y="17" fill="#FFF" font-family="'Inter', sans-serif" font-size="10">❖ Primary Logo Mark</text>
    </g>

    <g transform="translate(12, 68)">
      <rect width="136" height="26" rx="6" fill="#1E103B"/>
      <text x="12" y="17" fill="#A78BFA" font-family="'Inter', sans-serif" font-size="10">🎨 Color Palette Tokens</text>
    </g>

    <g transform="translate(12, 100)">
      <rect width="136" height="26" rx="6" fill="#1E103B"/>
      <text x="12" y="17" fill="#60A5FA" font-family="'Inter', sans-serif" font-size="10">🔤 Typography Scale</text>
    </g>

    <g transform="translate(12, 132)">
      <rect width="136" height="26" rx="6" fill="#1E103B"/>
      <text x="12" y="17" fill="#10B981" font-family="'Inter', sans-serif" font-size="10">📱 UI Component Library</text>
    </g>

    <!-- Color Palette Swatches Preview -->
    <text x="16" y="184" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="9" font-weight="700">BRAND COLOR SWATCHES</text>
    <circle cx="26" cy="204" r="12" fill="#6D28D9"/>
    <circle cx="56" cy="204" r="12" fill="#8B5CF6"/>
    <circle cx="86" cy="204" r="12" fill="#10B981"/>
    <circle cx="116" cy="204" r="12" fill="#F59E0B"/>
  </g>

  <!-- Right: Figma Design Artboard Canvas -->
  <g transform="translate(195, 58)">
    <rect width="385" height="322" rx="10" fill="#120826" stroke="rgba(139, 92, 246, 0.3)"/>
    
    <!-- Artboard 1: Desktop Web Frame -->
    <g transform="translate(16, 20)">
      <rect width="170" height="280" rx="8" fill="#1A0D38" stroke="#8B5CF6"/>
      <text x="12" y="20" fill="#A78BFA" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700">Desktop Web Frame</text>
      
      <rect x="12" y="32" width="146" height="40" rx="6" fill="#6D28D9"/>
      <text x="20" y="55" fill="#FFF" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700">Hero Design System</text>

      <rect x="12" y="80" width="146" height="60" rx="6" fill="#120728"/>
      <circle cx="32" cy="110" r="12" fill="#10B981"/>
      <rect x="52" y="98" width="90" height="8" rx="4" fill="#FFF"/>
      <rect x="52" y="112" width="70" height="6" rx="3" fill="#9CA3AF"/>
    </g>

    <!-- Artboard 2: Brand Color System -->
    <g transform="translate(198, 20)">
      <rect width="170" height="280" rx="8" fill="#1A0D38" stroke="#8B5CF6"/>
      <text x="12" y="20" fill="#A78BFA" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700">Brand Color System</text>

      <rect x="12" y="32" width="146" height="50" rx="6" fill="#6D28D9"/>
      <text x="20" y="54" fill="#FFF" font-family="'Inter', sans-serif" font-size="10" font-weight="700">#6D28D9 • Violet</text>

      <rect x="12" y="90" width="146" height="50" rx="6" fill="#10B981"/>
      <text x="20" y="112" fill="#FFF" font-family="'Inter', sans-serif" font-size="10" font-weight="700">#10B981 • Emerald</text>

      <rect x="12" y="148" width="146" height="50" rx="6" fill="#F59E0B"/>
      <text x="20" y="170" fill="#FFF" font-family="'Inter', sans-serif" font-size="10" font-weight="700">#F59E0B • Amber</text>
    </g>
  </g>
</svg>
