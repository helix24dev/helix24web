<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="appBgTheme" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0614"/>
      <stop offset="100%" stop-color="#040208"/>
    </linearGradient>
    <linearGradient id="phoneBodyTheme" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#281648"/>
      <stop offset="50%" stop-color="#150a29"/>
      <stop offset="100%" stop-color="#090412"/>
    </linearGradient>
    <linearGradient id="screenGradTheme" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b0e35"/>
      <stop offset="100%" stop-color="#0c051a"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#appBgTheme)"/>

  <!-- Concentric Radial Atmosphere -->
  <circle cx="300" cy="200" r="180" fill="none" stroke="#8b5cf6" stroke-opacity="0.08" stroke-width="1"/>
  <circle cx="300" cy="200" r="130" fill="none" stroke="#8b5cf6" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Minimalist Obsidian Phone Frame (Iso Isometric Perspective) -->
  <g transform="translate(300, 200) rotate(-10) scale(0.95)">
    <!-- Shadow -->
    <rect x="-95" y="-165" width="190" height="340" rx="36" fill="#000000" opacity="0.65"/>

    <!-- Phone Hardware Body -->
    <rect x="-90" y="-170" width="180" height="340" rx="32" fill="url(#phoneBodyTheme)" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="1.8"/>

    <!-- Inner Screen -->
    <rect x="-82" y="-162" width="164" height="324" rx="26" fill="url(#screenGradTheme)"/>

    <!-- Dynamic Island / Notch -->
    <rect x="-24" y="-154" width="48" height="14" rx="7" fill="#090412" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="0.8"/>

    <!-- Mobile UI Layout Wireframe (Purple Theme) -->
    <!-- Hero Banner Card -->
    <rect x="-68" y="-120" width="136" height="70" rx="12" fill="#30195c" fill-opacity="0.7" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="-35" cy="-85" r="16" fill="#8b5cf6" fill-opacity="0.4"/>
    <line x1="-10" y1="-95" x2="40" y2="-95" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <line x1="-10" y1="-82" x2="25" y2="-82" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Grid Cards -->
    <rect x="-68" y="-38" width="62" height="65" rx="10" fill="#20103e" stroke="#8b5cf6" stroke-opacity="0.25" stroke-width="1"/>
    <rect x="6" y="-38" width="62" height="65" rx="10" fill="#20103e" stroke="#8b5cf6" stroke-opacity="0.25" stroke-width="1"/>
    <rect x="-68" y="37" width="62" height="65" rx="10" fill="#20103e" stroke="#8b5cf6" stroke-opacity="0.25" stroke-width="1"/>
    <rect x="6" y="37" width="62" height="65" rx="10" fill="#20103e" stroke="#8b5cf6" stroke-opacity="0.25" stroke-width="1"/>

    <!-- Bottom Navigation Bar -->
    <rect x="-68" y="115" width="136" height="32" rx="16" fill="#120727" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="-42" cy="131" r="4" fill="#ffffff"/>
    <circle cx="-14" cy="131" r="3" fill="#8b5cf6"/>
    <circle cx="14" cy="131" r="3" fill="#8b5cf6"/>
    <circle cx="42" cy="131" r="3" fill="#8b5cf6"/>
  </g>

  <!-- Side Floating Micro Components -->
  <g transform="translate(90, 140)">
    <rect width="100" height="42" rx="8" fill="#1b0e36" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1"/>
    <text x="12" y="25" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#ffffff">FLUTTER / iOS</text>
  </g>

  <g transform="translate(410, 220)">
    <rect width="100" height="42" rx="8" fill="#1b0e36" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1"/>
    <text x="12" y="25" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#ffffff">60 FPS SPEED</text>
  </g>

  <text x="300" y="375" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a78bfa" opacity="0.6" text-anchor="middle">NATIVE_MOBILE // HYPERPERFORMANCE</text>
</svg>
