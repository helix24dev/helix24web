<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <!-- Outer Window Background -->
  <rect width="600" height="400" rx="14" fill="#0A0616"/>
  <rect width="598" height="398" x="1" y="1" rx="13" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.5"/>

  <!-- Left: iPhone 15 Pro Native App Mockup -->
  <g transform="translate(30, 25)">
    <rect width="250" height="350" rx="28" fill="#140A2C" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <!-- iPhone Notch -->
    <rect x="95" y="10" width="60" height="14" rx="7" fill="#05030A"/>

    <!-- App Header -->
    <text x="24" y="48" fill="#FFF" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">FitTrack Pro App</text>
    <text x="24" y="64" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="10">Personal Training &amp; Booking</text>

    <!-- Workout Booking Card -->
    <rect x="20" y="80" width="210" height="120" rx="12" fill="#1E103B"/>
    <text x="32" y="104" fill="#8B5CF6" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">TODAY'S SCHEDULE</text>
    <text x="32" y="126" fill="#FFF" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Personal HIIT Session</text>
    <text x="32" y="144" fill="#10B981" font-family="'Inter', sans-serif" font-size="11">● Confirmed • 10:00 AM</text>
    <rect x="32" y="156" width="146" height="28" rx="6" fill="#10B981"/>
    <text x="105" y="174" fill="#FFF" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Book Next Session →</text>

    <!-- Health Metrics Row -->
    <rect x="20" y="212" width="100" height="60" rx="8" fill="#1A0D36"/>
    <text x="28" y="232" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="9">CALORIES BURNED</text>
    <text x="28" y="254" fill="#F59E0B" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">645 kcal</text>

    <rect x="130" y="212" width="100" height="60" rx="8" fill="#1A0D36"/>
    <text x="138" y="232" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="9">AVG HEART RATE</text>
    <text x="138" y="254" fill="#EF4444" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">142 bpm</text>

    <!-- App Store Download Badge -->
    <rect x="20" y="285" width="210" height="42" rx="10" fill="#000" stroke="rgba(255,255,255,0.2)"/>
    <text x="50" y="304" fill="#FFF" font-family="'Inter', sans-serif" font-size="10">Download on the</text>
    <text x="50" y="318" fill="#FFF" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">App Store 🍎</text>
  </g>

  <!-- Right: Android Flutter App Mockup -->
  <g transform="translate(320, 25)">
    <rect width="250" height="350" rx="28" fill="#140A2C" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <!-- Android Hole Punch Camera -->
    <circle cx="125" cy="18" r="5" fill="#05030A"/>

    <!-- App Header -->
    <text x="24" y="48" fill="#FFF" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">UrbanNest Villas</text>
    <text x="24" y="64" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="10">Real Estate &amp; Rentals</text>

    <!-- Rental Booking Card -->
    <rect x="20" y="80" width="210" height="120" rx="12" fill="#1E103B"/>
    <rect x="30" y="92" width="190" height="60" rx="8" fill="#2A1650"/>
    <text x="40" y="128" fill="#FFF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" text-anchor="middle">LUXURY VILLA PREVIEW</text>
    <text x="32" y="172" fill="#3B82F6" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">$425 / night</text>

    <!-- Apple Pay / 1-Click Pay -->
    <rect x="20" y="212" width="210" height="60" rx="8" fill="#1A0D36"/>
    <text x="32" y="235" fill="#10B981" font-family="'Inter', sans-serif" font-size="11" font-weight="700">✓ 1-Click Instant Booking</text>
    <text x="32" y="255" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="10">Apple Pay &amp; Google Pay Enabled</text>

    <!-- Google Play Download Badge -->
    <rect x="20" y="285" width="210" height="42" rx="10" fill="#000" stroke="rgba(255,255,255,0.2)"/>
    <text x="50" y="304" fill="#FFF" font-family="'Inter', sans-serif" font-size="10">GET IT ON</text>
    <text x="50" y="318" fill="#FFF" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">Google Play 🤖</text>
  </g>
</svg>
