<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <linearGradient id="procBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#0e0e14"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#888899" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#11111a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="300" fill="url(#procBg)"/>

  <!-- Horizontal Axis Pipeline Line -->
  <line x1="100" y1="150" x2="800" y2="150" stroke="url(#beamGrad)" stroke-width="2"/>
  <line x1="100" y1="150" x2="800" y2="150" stroke="#ffffff" stroke-dasharray="4,8" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Step 01 Node -->
  <g transform="translate(180, 150)">
    <circle cx="0" cy="0" r="40" fill="#0f0f18" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="24" fill="#181824" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff"/>
    <text x="0" y="70" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="2">01 / DISCOVERY</text>
    <text x="0" y="90" font-family="'Inter', sans-serif" font-size="11" fill="#888899" text-anchor="middle">Audit & Architecture</text>
  </g>

  <!-- Step 02 Node -->
  <g transform="translate(450, 150)">
    <circle cx="0" cy="0" r="48" fill="#12121c" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2"/>
    <circle cx="0" cy="0" r="30" fill="#202030" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
    <polygon points="-6,-10 10,0 -6,10" fill="#ffffff"/>
    <text x="0" y="75" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="2">02 / BUILD & CODE</text>
    <text x="0" y="95" font-family="'Inter', sans-serif" font-size="11" fill="#888899" text-anchor="middle">High-Performance Build</text>
  </g>

  <!-- Step 03 Node -->
  <g transform="translate(720, 150)">
    <circle cx="0" cy="0" r="40" fill="#0f0f18" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="24" fill="#181824" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    <polyline points="-8,4 0,-6 8,4" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="70" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="2">03 / SCALE & ROI</text>
    <text x="0" y="90" font-family="'Inter', sans-serif" font-size="11" fill="#888899" text-anchor="middle">SEO & Ad Funnels</text>
  </g>
</svg>
