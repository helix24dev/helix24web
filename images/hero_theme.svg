<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Dark Obsidian & Deep Purple Background -->
    <linearGradient id="bgGradTheme" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0717"/>
      <stop offset="50%" stop-color="#160e2e"/>
      <stop offset="100%" stop-color="#07040d"/>
    </linearGradient>

    <!-- Helix Violet Gradients -->
    <linearGradient id="violetGradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <linearGradient id="violetGlowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="purpleCoreGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#6d28d9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="purpleGlowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradTheme)"/>
  
  <!-- Vibrant Ambient Purple Glow -->
  <circle cx="400" cy="270" r="300" fill="url(#purpleCoreGlow)"/>

  <!-- Geometric Grid Rays & Orbit Circles -->
  <g opacity="0.25" stroke="#8b5cf6" stroke-width="0.8">
    <line x1="100" y1="0" x2="700" y2="600"/>
    <line x1="700" y1="0" x2="100" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <circle cx="400" cy="300" r="160" fill="none" stroke-dasharray="3,6"/>
    <circle cx="400" cy="300" r="260" fill="none" stroke-dasharray="2,8"/>
  </g>

  <!-- Architectural 3D Isometric Slabs (Helix Violet Glass Aesthetics) -->
  <g transform="translate(400, 290) rotate(-15) scale(0.95)" filter="url(#purpleGlowFilter)">
    
    <!-- Slab 3 (Background Deep Violet Layer) -->
    <g transform="translate(0, 70)">
      <polygon points="-240,-60 0,-180 240,-60 0,60" fill="#1e113a" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1"/>
      <polygon points="0,60 240,-60 240,-40 0,80" fill="#120a24"/>
      <polygon points="-240,-60 0,60 0,80 -240,-40" fill="#28174e"/>
    </g>

    <!-- Slab 2 (Mid-layer Glowing Violet Glass) -->
    <g transform="translate(0, 10)">
      <polygon points="-260,-60 0,-180 260,-60 0,60" fill="url(#violetGradMain)" fill-opacity="0.18" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="1.2"/>
      <polygon points="0,60 260,-60 260,-48 0,72" fill="#3b1d82" fill-opacity="0.6"/>
      <polygon points="-260,-60 0,60 0,72 -260,-48" fill="#581c87" fill-opacity="0.5"/>
      
      <!-- Architectural Grid Lines -->
      <line x1="-130" y1="0" x2="130" y2="-120" stroke="#ddd6fe" stroke-opacity="0.4" stroke-width="0.8"/>
      <line x1="-65" y1="30" x2="195" y2="-90" stroke="#ddd6fe" stroke-opacity="0.3" stroke-width="0.8"/>
      <line x1="-195" y1="-30" x2="65" y2="-150" stroke="#ddd6fe" stroke-opacity="0.3" stroke-width="0.8"/>
    </g>

    <!-- Slab 1 (Top Glass Slab with Bright Neon Edges) -->
    <g transform="translate(0, -50)">
      <!-- Top Face -->
      <polygon points="-280,-60 0,-180 280,-60 0,60" fill="url(#violetGradMain)" fill-opacity="0.35" stroke="#c4b5fd" stroke-opacity="0.9" stroke-width="1.8"/>
      <!-- Right Edge -->
      <polygon points="0,60 280,-60 280,-45 0,75" fill="#6d28d9" fill-opacity="0.7"/>
      <!-- Left Edge -->
      <polygon points="-280,-60 0,60 0,75 -280,-45" fill="#3b0764" fill-opacity="0.85"/>

      <!-- Glowing Nodes & Neon Violet Beams -->
      <circle cx="0" cy="-60" r="5" fill="#ffffff" filter="url(#purpleGlowFilter)"/>
      <circle cx="-140" cy="0" r="4" fill="#a78bfa"/>
      <circle cx="140" cy="0" r="4" fill="#a78bfa"/>
      <circle cx="0" cy="60" r="4.5" fill="#ffffff"/>

      <line x1="-140" y1="0" x2="0" y2="-60" stroke="#c4b5fd" stroke-opacity="0.8" stroke-width="1.5"/>
      <line x1="0" y1="-60" x2="140" y2="0" stroke="#c4b5fd" stroke-opacity="0.8" stroke-width="1.5"/>
      <line x1="140" y1="0" x2="0" y2="60" stroke="#c4b5fd" stroke-opacity="0.8" stroke-width="1.5"/>
      <line x1="0" y1="60" x2="-140" y2="0" stroke="#c4b5fd" stroke-opacity="0.8" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Vertical Neon Light Beams -->
  <line x1="400" y1="30" x2="400" y2="240" stroke="url(#violetGlowGrad)" stroke-width="2.5"/>
  <line x1="260" y1="100" x2="260" y2="300" stroke="url(#violetGlowGrad)" stroke-width="1.5" opacity="0.7"/>
  <line x1="540" y1="100" x2="540" y2="300" stroke="url(#violetGlowGrad)" stroke-width="1.5" opacity="0.7"/>

  <!-- Minimalist Typography / Details -->
  <text x="40" y="560" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#a78bfa" letter-spacing="3" opacity="0.8">HELIX24 // VIOLET THEME ARCHITECTURE</text>
  <text x="760" y="560" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#a78bfa" letter-spacing="3" text-anchor="end" opacity="0.8">01 / BRAND MATCHED</text>
</svg>
