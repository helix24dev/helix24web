# Netlify builds the Next.js app in frontend/.
# The Next.js runtime is declared explicitly: auto-detection did not apply it, which uploaded raw .next and 404'd every route.
# Legacy .html redirects live in frontend/next.config.mjs.
[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers live in frontend/next.config.mjs
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
